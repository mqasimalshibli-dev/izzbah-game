<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The game moved to the site ROOT on 2026-08-09 (build .291). This path
       survives only so older links, bookmarks, shared «#g=» games and phones
       that installed the PWA while start_url was still here keep working.
       ⚠️ THE HASH IS THE PAYLOAD of a shared game link — it must be forwarded,
       or every «#g=» link that lands here quietly opens an empty game. That is
       why the redirect is a script and not just the meta refresh below: a
       refresh cannot carry a fragment, and running here in <head>, during
       parsing, it wins the race against it.
       The meta refresh stays as the no-JS fallback. It loses the hash, which
       is academic — the game needs JavaScript to run at all. -->
  <script>
    (function () {
      var to = "./" + location.search + location.hash;
      location.replace(to);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./">
  <!-- A redirect is not an index candidate; the root is. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://izzbah.com/">
  <title>عِزبة</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #efd6ba;
      color: #9f1515;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
    }

    a {
      color: #9f1515;
      font-size: 28px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <a id="go" href="./">اضغط هنا لفتح اللعبة</a>
  <script>document.getElementById("go").href = "./" + location.search + location.hash;</script>
</body>
</html>
