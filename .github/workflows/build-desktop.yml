name: Build Windows desktop (.exe)

# Run manually from the Actions tab, or automatically when you push a tag like v1.0.0
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy game into desktop wrapper
        shell: bash
        run: cp game-mobile.html desktop/game-mobile.html

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build portable + installer
        working-directory: desktop
        run: npm run dist

      - name: Upload .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: izzbah-windows-exe
          path: |
            desktop/dist/*.exe
          if-no-files-found: error

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
