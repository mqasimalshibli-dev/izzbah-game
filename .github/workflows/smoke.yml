name: Smoke test

# Boots the game in a headless browser and checks the core paths still work.
# Runs on every push/PR that touches the game or the tests themselves.
on:
  push:
    paths:
      - "index.html"
      - "game-mobile.html"
      - "game.html"
      - "sitemap.xml"
      - "sw.js"
      - "assets/brand/manifest.webmanifest"
      - "tests/**"
      - "preview/**"
      - ".github/workflows/smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "game-mobile.html"
      - "game.html"
      - "sitemap.xml"
      - "sw.js"
      - "assets/brand/manifest.webmanifest"
      - "tests/**"
      - "preview/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test deps
        working-directory: tests
        run: |
          npm install --no-save playwright-core playwright jsqr

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install chromium

      # Every test step below carries `if: ${{ !cancelled() }}` so ONE failure
      # reports and the run carries on. Without it GitHub skips every later step:
      # the boot byte-budget went over at build .320 and quietly took 39 tests
      # with it — including the media-wipe and restore guards — for seven builds.
      # A red run should say everything that is wrong, not just the first thing.
      - name: Run purchase-fulfilment unit tests (Cloud Functions)
        if: ${{ !cancelled() }}
        run: node functions/test/fulfilment.test.mjs

      - name: Run account-erasure unit tests (Cloud Functions)
        if: ${{ !cancelled() }}
        run: node functions/test/erasure.test.mjs

      - name: Run RevenueCat webhook unit tests (Cloud Functions)
        if: ${{ !cancelled() }}
        run: node functions/test/revenuecat.test.mjs

      - name: Run smoke test
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node smoke.mjs

      - name: Run legal/consent gate test
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node legal.mjs

      - name: Run question-health panel test
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node qhealth.mjs

      - name: Run community report/block test
