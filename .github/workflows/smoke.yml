name: Smoke test

# Boots the game in a headless browser and checks the core paths still work.
# Runs on every push/PR that touches the game or the tests themselves.
on:
  push:
    paths:
      - "game-mobile.html"
      - "sw.js"
      - "assets/brand/manifest.webmanifest"
      - "tests/**"
      - ".github/workflows/smoke.yml"
  pull_request:
    paths:
      - "game-mobile.html"
      - "sw.js"
      - "assets/brand/manifest.webmanifest"
      - "tests/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test deps
        working-directory: tests
        run: |
          npm install --no-save playwright-core playwright jsqr

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install chromium

      - name: Run purchase-fulfilment unit tests (Cloud Functions)
        run: node functions/test/fulfilment.test.mjs

      - name: Run smoke test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node smoke.mjs

      - name: Run legal/consent gate test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node legal.mjs

      - name: Run question-health panel test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
