name: Smoke test

# Boots the game in a headless browser and checks the core paths still work.
# Runs on every push/PR that touches the game or the tests themselves.
on:
  push:
    paths:
      - "game-mobile.html"
      - "tests/**"
      - ".github/workflows/smoke.yml"
  pull_request:
    paths:
      - "game-mobile.html"
      - "tests/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test deps
        working-directory: tests
        run: |
          npm install --no-save playwright-core playwright

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install chromium

      - name: Run smoke test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node smoke.mjs

      - name: Run legal/consent gate test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node legal.mjs

      - name: Run bulk-import test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node import.mjs

      - name: Run shared-game-link test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node sharegame.mjs

      - name: Run admin undo test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node undo.mjs

      - name: Run question-timer test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node timer.mjs

      - name: Run splash-screen test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node splash.mjs

      - name: Run results stats + share-card test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node results.mjs

      - name: Run gameplay-correctness test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node gameplay.mjs

      - name: Run admin media-preview test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node mediapreview.mjs

      - name: Run player-subscriptions test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node premium.mjs

      - name: Run category-features test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node categoryfeatures.mjs

      - name: Run in-app-browser guidance test
        working-directory: tests
        run: |
          IZZBAH_CHROMIUM="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            node webview.mjs
